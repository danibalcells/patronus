[project]
name = "patronus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "feedgen>=1.0.0",
    "feedparser>=6.0.11",
    "google-cloud-storage>=3.3.0",
    "ipython>=9.4.0",
    "jupyter>=1.1.1",
    "numpy>=1.24.0",
    "openai>=1.101.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "sqlmodel>=0.0.33",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
