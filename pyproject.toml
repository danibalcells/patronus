[project]
name = "patronus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.79.0",
    "feedgen>=1.0.0",
    "feedparser>=6.0.11",
    "google-cloud-storage>=3.3.0",
    "google-genai>=1.63.0",
    "ipython>=9.4.0",
    "jupyter>=1.1.1",
    "langfuse>=3.14.3",
    "notion-client>=2.7.0",
    "numpy>=1.24.0",
    "openai>=1.101.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "python-telegram-bot>=22.6",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.33",
    "tenacity>=9.1.4",
    "tqdm>=4.67.1",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external APIs (skipped unless -m integration)",
]
addopts = "-m 'not integration'"
